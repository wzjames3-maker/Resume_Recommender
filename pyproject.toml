[project]
name = "maxkb"
version = "2.0.0"
description = "强大易用的开源企业级智能体平台"
authors = [{ name = "shaohuzhang1", email = "shaohu.zhang@fit2cloud.com" }]
requires-python = "~=3.11.0"
readme = "README.md"
dependencies = [
    "django==5.2.16",
    "drf-spectacular[sidecar]==0.28.0",
    "django-redis==6.0.0",
    "django-db-connection-pool==1.2.6",
    "django-mptt==0.17.0",
    "djangorestframework==3.17.1",
    "psycopg[binary]==3.2.9",
    "python-dotenv==1.2.2",
    "uuid-utils==0.14.0",
    "captcha==0.7.1",
    "pytz==2025.2",
    "psutil==7.0.0",
    "beautifulsoup4==4.13.4",
    "jieba==0.42.1",
    "langchain==1.3.10",
    "langchain-core==1.4.8",
    "langchain-openai==1.3.2",
    "celery[sqlalchemy]==5.5.3",
    "django-celery-beat==2.8.1",
    "celery-once==3.0.1",
    "django-apscheduler==0.7.0",
    "openpyxl==3.1.5",
    "python-docx==1.2.0",
    "xlrd==2.0.2",
    "xlwt==1.3.0",
    "pypdf==6.15.0",
    "pydub==0.25.1",
    "pysilk==0.0.1",
    "gunicorn==23.0.0",
    "python-daemon==3.1.2",
    "websockets==15.0.1",
    "ruff==0.15.12",
    "jsonpath-ng==1.8.0",
    "jinja2==3.1.6",
    "markdownify==1.2.2",
    "polib==1.2.0",
    "cryptography==50.0.0",
    "pycryptodome>=3.23.0",
    "minio>=7.2.20",
]

[tool.uv]
package = false

[tool.ruff]
line-length = 120

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
