[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "agentkb-platform"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]",
    "sqlalchemy[asyncio]>=2.0",
    "asyncpg",
    "alembic",
    "pydantic>=2.7",
    "pydantic-settings",
    "pgvector",
    "redis>=5.0",
    "celery>=5.4",
    "PyJWT",
    "bcrypt",
    "cryptography",
    "httpx",
    "python-multipart",
    "email-validator",
    "python-docx>=1.1",
    "pypdf>=4.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio",
    "aiosqlite",
    "ruff",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-asyncio",
    "aiosqlite",
    "ruff",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_test_loop_scope = "session"
pythonpath = ["."]

[tool.ruff.lint]
per-file-ignores = { "app/api/*" = ["BLE001"] }

[tool.ruff.lint.flake8-bugbear]
extend-immutable-calls = ["fastapi.Depends", "fastapi.security.HTTPBearer"]

[tool.setuptools.packages.find]
where = ["."]
namespaces = false