services:
  db:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-agentkb}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
    ports: ["${POSTGRES_PORT:-5432}:5432"]
    volumes: ["pgdata:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres}"]
      interval: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    ports: ["${REDIS_PORT:-6379}:6379"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      retries: 5

  api:
    build: ./backend
    ports: ["${API_PORT:-8000}:8000"]
    env_file:
      - path: ./backend/.env
        required: false
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@db:5432/${POSTGRES_DB:-agentkb}
      REDIS_URL: redis://redis:6379/0
      JWT_SECRET: ${JWT_SECRET:-b8f1a2c3d4e5f60718293a4b5c6d7e8f90a1b2c3d4e5f60718293a4b5c6d7e8f9}
      MODEL_KEY_ENC_KEY: ${MODEL_KEY_ENC_KEY:-0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef}
      RESUME_UPLOAD_DIR: /tmp/uploads
    depends_on:
      db: { condition: service_healthy }
      redis: { condition: service_healthy }
    command: sh -c "alembic upgrade head && uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload"
    volumes:
      - "./backend:/app"
      - "uploads:/tmp/uploads"

  worker:
    build: ./backend
    env_file:
      - path: ./backend/.env
        required: false
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@db:5432/${POSTGRES_DB:-agentkb}
      REDIS_URL: redis://redis:6379/0
      JWT_SECRET: ${JWT_SECRET:-b8f1a2c3d4e5f60718293a4b5c6d7e8f90a1b2c3d4e5f60718293a4b5c6d7e8f9}
      MODEL_KEY_ENC_KEY: ${MODEL_KEY_ENC_KEY:-0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef}
      RESUME_UPLOAD_DIR: /tmp/uploads
    depends_on:
      db: { condition: service_healthy }
      redis: { condition: service_healthy }
    command: celery -A app.tasks.celery_app.celery_app worker --loglevel=info
    volumes:
      - "./backend:/app"
      - "uploads:/tmp/uploads"

  frontend:
    build: ./frontend
    ports: ["${FRONTEND_PORT:-3000}:80"]
    depends_on:
      - api

volumes:
  pgdata:
  uploads: